apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: maas-debug-echo
  namespace: llm
  labels:
    maas.opendatahub.io/fullcheck: "echo"
  annotations:
    openshift.io/display-name: "MaaS debug echo simulator"
    openshift.io/description: "llm-d-inference-sim --mode echo for integrity checks"
spec:
  model:
    uri: hf://placeholder/no-model
    name: maas-debug-echo
  storageInitializer:
    enabled: false
  replicas: 1
  router:
    route: {}
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
  template:
    containers:
      - name: main
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.8.2
        imagePullPolicy: IfNotPresent
        command: ["/app/llm-d-inference-sim"]
        args:
          - --port
          - "8000"
          - --model
          - maas-debug-echo
          - --mode
          - echo
          - --no-mm-encoder-only
          - --ssl-certfile
          - /var/run/kserve/tls/tls.crt
          - --ssl-keyfile
          - /var/run/kserve/tls/tls.key
        env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
        ports:
          - name: https
            containerPort: 8000
            protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: https
            scheme: HTTPS
        readinessProbe:
          httpGet:
            path: /ready
            port: https
            scheme: HTTPS
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
